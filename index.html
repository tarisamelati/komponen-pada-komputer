<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jelajah Komponen Komputer</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#7A1E1E;color:white;text-align:center}
h1{font-size:32px;margin-top:30px}
p{font-size:16px}
.menu{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;max-width:700px;margin:20px auto}
button{background:#FFF8E7;border:none;padding:15px 20px;font-size:17px;border-radius:12px;cursor:pointer;width:220px}
button:hover{background:#FFD966}
#detail{background:white;color:#333;max-width:700px;margin:20px auto;padding:25px;border-radius:15px;text-align:left;min-height:200px}
#detail h2{margin:0 0 10px 0;color:#7A1E1E}
#detail img{width:100%;max-width:400px;border-radius:10px;display:block;margin:10px auto}
.emoji{font-size:70px;text-align:center}
</style>
</head>
<body>

<h1>🖥️ Jelajah Komponen Komputer</h1>
<p>Klik salah satu komponen untuk melihat foto dan penjelasan</p>
<p>UTS Arsitektur dan Organisasi Komputer</p>

<div class="menu">
<button onclick="show('cpu')">🧠 CPU</button>
<button onclick="show('ram')">⚡ RAM</button>
<button onclick="show('motherboard')">🔌 Motherboard</button>
<button onclick="show('storage')">💾 Storage</button>
<button onclick="show('gpu')">🎮 GPU / VGA</button>
<button onclick="show('psu')">🔋 PSU</button>
</div>

<div id="detail">
<h2>Silakan pilih komponen di atas</h2>
<p>Foto contoh dan penjelasan akan muncul di bagian ini.</p>
</div>

<script>
function show(key){
  var d = document.getElementById('detail');
  if(key=='cpu'){
    d.innerHTML = '<div class="emoji">🧠</div><h2>CPU - Otak Komputer</h2><p>CPU adalah pusat pemrosesan semua instruksi dan perhitungan di komputer. Semakin tinggi kecepatan dan jumlah core-nya, semakin cepat komputer memproses data.</p><p><b>Kalau rusak:</b> Komputer tidak bisa menyala / tidak bisa memproses perintah.</p>';
  }
  if(key=='ram'){
    d.innerHTML = '<div class="emoji">⚡</div><h2>RAM - Memori Sementara</h2><p>RAM menyimpan data yang sedang diproses agar bisa diakses dengan cepat. RAM besar membuat multitasking lancar, tapi datanya hilang saat komputer mati.</p><p><b>Kalau rusak:</b> Komputer lemot dan sering nge-hang.</p>';
  }
  if(key=='motherboard'){
    d.innerHTML = '<div class="emoji">🔌</div><h2>Motherboard</h2><p>Papan utama yang menghubungkan CPU, RAM, GPU, dan storage agar bisa saling berkomunikasi dan bekerja sama.</p><p><b>Kalau rusak:</b> Semua komponen tidak bisa terhubung.</p>';
  }
  if(key=='storage'){
    d.innerHTML = '<div class="emoji">💾</div><h2>Storage - SSD / HDD</h2><p>Tempat menyimpan data permanen seperti sistem operasi, aplikasi, dan file. SSD lebih cepat daripada HDD.</p><p><b>Kalau rusak:</b> Data hilang dan komputer tidak bisa booting.</p>';
  }
  if(key=='gpu'){
    d.innerHTML = '<div class="emoji">🎮</div><h2>GPU / VGA Card</h2><p>GPU mengolah grafis dan tampilan ke layar. Sangat penting untuk desain, editing video, dan gaming.</p><p><b>Kalau rusak:</b> Tampilan pecah-pecah atau tidak muncul gambar.</p>';
  }
  if(key=='psu'){
    d.innerHTML = '<div class="emoji">🔋</div><h2>PSU - Power Supply Unit</h2><img src="PSU.jpg"><p>PSU mengubah listrik AC dari stopkontak menjadi DC dan menyalurkan daya ke motherboard, CPU, GPU, dan storage.</p><p><b>Kalau rusak:</b> Komputer tidak dapat menyala sama sekali.</p>';
  }
}
</script>

</body>
</html>
